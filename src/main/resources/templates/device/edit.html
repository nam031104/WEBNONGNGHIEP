<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sửa thiết bị</title>
    <meta charset="UTF-8" />

    <!-- CSS -->
    <link rel="stylesheet" href="/css/fragment/userLayout.css">
    <link rel="stylesheet" href="/css/device/updateDevice.css">
</head>

<body>

<div th:replace="fragment/userLayout :: header"></div>

<div class="main-content">
    <div class="form-container">

        <div class="form-card">
            <h2 class="form-title">Sửa thiết bị</h2>

            <form th:action="@{/user/device/update/{id}(id=${updateDeviceDto.idDevice})}"
                  method="post"
                  th:object="${updateDeviceDto}">

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" th:field="*{name}" />
                </div>

                <div class="form-group">
                    <label>Type Device</label>
                    <input type="text" th:field="*{typeDevice}" />
                </div>

                <button type="submit" class="btn-submit" onclick="return confirm('Bạn chắc chắn sửa?')">Sửa</button>
            </form>
        </div>

    </div>
</div>


<div th:replace="fragment/userLayout :: footer"></div>

</body>
</html>
