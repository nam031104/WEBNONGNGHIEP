<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dang nhap</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-shell">
    <section class="auth-card">
        <p class="eyebrow">IoT Nong Nghiep</p>
        <h1>Dang nhap he thong</h1>
        <p class="subtitle">Quan ly tai khoan va phan quyen cho du an nong nghiep thong minh.</p>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>
        <div class="alert success" th:if="${success}" th:text="${success}"></div>
        <div class="alert success" th:if="${param.logout}">Dang xuat thanh cong.</div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="nhap username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="nhap mat khau" required>

            <button type="submit">Dang nhap</button>
        </form>

        <p class="switch-link">
            Chua co tai khoan?
            <a th:href="@{/register}">Dang ky ngay</a>
        </p>
    </section>
</main>
</body>
</html>
