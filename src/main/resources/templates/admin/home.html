<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Home</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-shell">
    <section class="auth-card wide">
        <p class="eyebrow">Khu Vuc Admin</p>
        <h1>Xin chao, <span th:text="${username}">admin</span></h1>
        <p class="subtitle">Đây là trang riêng dành cho ADMIN để sau này tích hợp các chức năng quản trị.</p>

        <div class="alert success">
            Quyền hiện tại:
            <span th:text="${authorities}"></span>
        </div>

        <div class="hero-actions single">
            <a class="action-link secondary" th:href="@{/}">Về trang chủ</a>
            <a class="action-link secondary" th:href="@{/admin/membership}">Chỉnh sửa hội viên</a>
            <a class="action-link secondary" th:href="@{/admin/notification}">Thông báo cho hội viên</a>
        </div>

        <form th:action="@{/logout}" method="post" class="auth-form">
            <button type="submit">Đăng xuất</button>
        </form>
    </section>
</main>
</body>
</html>
