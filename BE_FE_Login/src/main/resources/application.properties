spring.application.name=nongnghiep
server.port=8080

# Chi can sua block nay de doi cau hinh ket noi database
app.db.host=localhost
app.db.port=3306
app.db.name=iot
app.db.username=root
app.db.password=

spring.datasource.url=jdbc:mysql://${app.db.host}:${app.db.port}/${app.db.name}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok&characterEncoding=UTF-8
spring.datasource.username=${app.db.username}
spring.datasource.password=${app.db.password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

app.jwt.secret=${JWT_SECRET:VGhpc0lzQVNlY3VyZVNlY3JldEtleUZvckpXVEVuY29kaW5nMTIzNDU2Nzg5MDE=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
