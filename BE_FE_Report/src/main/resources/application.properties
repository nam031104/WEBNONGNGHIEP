spring.application.name=be-fe-report
server.port=8082

# Update only this block when changing MySQL connection information
app.db.host=localhost
app.db.port=3306
app.db.name=iot
app.db.username=root
app.db.password=

spring.datasource.url=jdbc:mysql://${app.db.host}:${app.db.port}/${app.db.name}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok&characterEncoding=UTF-8
spring.datasource.username=${app.db.username}
spring.datasource.password=${app.db.password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false
