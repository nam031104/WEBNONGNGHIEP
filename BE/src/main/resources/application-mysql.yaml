spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/iot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:db-schema-mysql.sql
