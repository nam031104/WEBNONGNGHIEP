spring:
  application:
    name: be-login
  profiles:
    active: ${APP_DB_PROFILE:mysql}

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: true

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTAuthenticationAndAuthorizationiVeryLongAndSecureKey12345}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    btl.nongnghiep: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

